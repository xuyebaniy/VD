name: Refresh doctors and publish Vash Doctor PWA
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-cabinet:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check demo data isolation and public cache
        run: |
          node tests/demo-adapter.cjs
          node tests/demo-stats.cjs
          node tests/cabinet-api.cjs
          node tests/cabinet-cache.cjs
      - name: Prepare clinic API security test runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, openssl
          coverage: none
      - name: Verify email codes and server access boundaries without sending mail
        run: |
          php integration/patient-cabinet/tests/security.php
          python3 integration/patient-cabinet/tests/http_security.py php
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/vd-ui" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/vd-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify parent and doctor demo in browser
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/vd-static.log" 2>&1 &
          vd_test_server_pid=$!
          trap 'kill "$vd_test_server_pid" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/vd-ui/node_modules" VD_BASE_URL=http://127.0.0.1:8765 VD_QA_DIR="$RUNNER_TEMP/vd-cabinet-screenshots" node tests/demo-ui.cjs
          NODE_PATH="$RUNNER_TEMP/vd-ui/node_modules" VD_BASE_URL=http://127.0.0.1:8765 VD_QA_DIR="$RUNNER_TEMP/vd-cabinet-screenshots" node tests/booking-embed.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabinet-interface-checks
          path: ${{ runner.temp }}/vd-cabinet-screenshots
          if-no-files-found: ignore
          retention-days: 7
  build:
    needs: verify-cabinet
    if: always() && (needs.verify-cabinet.result == 'success' || needs.verify-cabinet.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/doctors.json
            assets/doctors/
          key: vd-public-doctors-${{ github.run_id }}
          restore-keys: |
            vd-public-doctors-
      - name: Fetch published doctors from clinic
        id: sync
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          if python scripts/sync_doctors.py; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Website unavailable: checking the last verified directory"
            python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/doctors.json').read_text(encoding='utf-8'))
          if not obj.get('source','').startswith('https://vash-doc.ru/specialists/') or len(obj.get('doctors',[]))<10:
              raise SystemExit('No previously verified doctor catalog - refusing to deploy stale prototype')
          photo_count = sum(
              isinstance(d.get('photo'), str)
              and d['photo'].startswith('assets/doctors/')
              and Path(d['photo']).is_file()
              for d in obj['doctors']
          )
          if photo_count < max(8, int(len(obj['doctors']) * 0.70)):
              raise SystemExit(f'Cached doctor photos missing: {photo_count}/{len(obj["doctors"])}')
          print('Using verified cached catalog:',len(obj['doctors']),'doctors and',photo_count,'photos')
          PY
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/doctors.json').read_text(encoding='utf-8'))
          photos=[d['photo'] for d in obj['doctors'] if isinstance(d.get('photo'),str) and d['photo'].startswith('assets/doctors/')]
          missing=[p for p in photos if not Path(p).is_file()]
          if missing:
              raise SystemExit('Doctor photo files missing from deployment: '+str(missing[:5]))
          print('Publishing',len(obj['doctors']),'doctors with',len(photos),'packaged photos')
          PY
          python - <<'PY'
          from PIL import Image
          src=Image.open('icons/apple-touch-icon.png').convert('RGBA')
          for size in (192,512):
              src.resize((size,size),Image.Resampling.LANCZOS).save(f'icons/icon-{size}.png')
          PY
      - uses: actions/cache/save@v4
        if: steps.sync.outputs.updated == 'true'
        with:
          path: |
            data/doctors.json
            assets/doctors/
          key: vd-public-doctors-${{ github.run_id }}
      - name: Embed verified doctors in original PWA
        run: |
          python3 tests/embed-doctors.py
          python scripts/embed_doctors.py
      - name: Validate cabinet scripts and stage public files only
        run: |
          node --check cabinet-demo.js
          node --check cabinet-config.js
          node --check cabinet-api.js
          node --check doctor-cabinet.js
          node --check patient-cabinet.js
          node --check pwa-updates.js
          node --check sw.js
          python scripts/stage_public.py
          python3 tests/clinic-build.py
      - name: Install generated artifact test runtime
        run: npm install --prefix "$RUNNER_TEMP/vd-dom" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
      - name: Verify generated Pages artifact before upload
        env:
          NODE_PATH: ${{ runner.temp }}/vd-dom/node_modules
          VD_SITE_ROOT: ${{ github.workspace }}/_site
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const { JSDOM } = require('jsdom');
          const filename = path.join(process.env.VD_SITE_ROOT, 'index.html');
          const dom = new JSDOM(fs.readFileSync(filename, 'utf8'));
          const scripts = [...dom.window.document.querySelectorAll('script:not([src])')]
            .filter(script => !script.type || /^(?:text|application)\/(?:java|ecma)script$/i.test(script.type))
            .map(script => script.textContent);
          dom.window.close();
          assert.ok(scripts.length, 'Generated index.html must contain executable inline scripts');
          scripts.forEach((code, index) => new vm.Script(code, { filename: `${filename}:inline-${index + 1}` }));
          // Separate classic scripts share global lexical bindings in the page.
          new vm.Script(scripts.join('\n;\n'), { filename: `${filename}:all-inline-scripts` });
          console.log(`Generated artifact: ${scripts.length} inline scripts parse successfully`);
          JS
          node tests/demo-dom.cjs
          node tests/email-auth-ui.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow GitHub artifact index to settle
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
