name: Publish original VD app and refresh doctors
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public doctor data
        run: |
          python -m pip install --quiet requests beautifulsoup4 Pillow
          python scripts/sync_doctors.py
          python - <<'PY'
          from PIL import Image
          src=Image.open('icons/apple-touch-icon.png').convert('RGBA')
          for size in (192,512):
              src.resize((size,size),Image.Resampling.LANCZOS).save(f'icons/icon-{size}.png')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
